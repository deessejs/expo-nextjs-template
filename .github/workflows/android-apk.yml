name: Android preview APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build installable APK (local EAS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "Add the EXPO_TOKEN repository secret." >&2; exit 1; fi
          if [ -z "$EXPO_PROJECT_ID" ]; then echo "Add the EXPO_PROJECT_ID repository secret." >&2; exit 1; fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then echo "Add the EXPO_PUBLIC_API_URL repository variable with a reachable Next.js deployment origin." >&2; exit 1; fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build APK with EAS local mode
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: pnpm dlx eas-cli@27.11.0 build --local --non-interactive --platform android --profile preview --output ../../deessejs-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deessejs-android-preview-apk
          path: deessejs-preview.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize artifact
        if: success()
        run: |
          echo "## Android preview APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **deessejs-android-preview-apk** (retained for 14 days)." >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from this workflow run's **Artifacts** section." >> "$GITHUB_STEP_SUMMARY"
